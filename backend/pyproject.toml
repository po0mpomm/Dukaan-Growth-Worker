[tool.ruff]
target-version = "py313"
line-length = 100
select = ["E", "F", "W", "I", "N", "UP", "B", "S"]
ignore = ["S101", "S311"]  # Allow assert in tests; allow random for synthetic data

[tool.ruff.per-file-ignores]
"tests/*" = ["S", "B"]

[tool.mypy]
python_version = "3.13"
strict = false
ignore_missing_imports = true
disallow_untyped_defs = true
warn_return_any = true
warn_unused_ignores = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-v --tb=short"

[tool.coverage.run]
source = ["app"]
omit = ["tests/*", "*/migrations/*"]

[tool.bandit]
exclude_dirs = ["tests", ".venv"]
skips = ["B101"]
