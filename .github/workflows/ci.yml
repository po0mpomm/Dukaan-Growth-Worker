name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  backend-test:
    name: Backend Pytest & Evaluation Suite
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install httpx

      - name: Run Backend Unit & Integration Tests
        run: |
          python -m pytest backend/tests/ -v

      - name: Run Cloud Plane Tests
        run: |
          python -m pytest cloud/tests/ -v

      - name: Run Evaluation Benchmark
        run: |
          python eval/runner.py

      - name: Test Synthetic Data Tools
        run: |
          python tools/generate_synthetic_data.py --output-dir /tmp/test_synth --records 20
          python tools/fleet_simulator.py --shops 5 --output-dir /tmp/test_fleet

  frontend-build:
    name: Frontend Lint & Production Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Build Next.js 15 App
        working-directory: ./frontend
        run: npm run build
